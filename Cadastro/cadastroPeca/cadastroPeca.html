<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro Peça - MOTORPOINT</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body class="text-slate-100 min-h-screen flex flex-col font-sans">

    <!-- HEADER -->
    <header class="bg-[#1C2541] border-b border-slate-800/80 px-8 py-4 flex items-center justify-between shadow-lg">
        <div class="flex items-center space-x-4">
            <a href="../../menuPrincipal/index.html" class="text-slate-300 hover:text-white transition flex items-center space-x-2">
                <i class="fa-solid fa-arrow-left text-lg"></i>
            </a>
            <h1 class="text-xl font-bold tracking-wide text-slate-100">Cadastro Peça</h1>
        </div>
        <button onclick="openModal()" class="bg-[#E06666] hover:bg-[#c95252] text-white px-5 py-2.5 rounded-xl font-semibold shadow-md transition flex items-center space-x-2">
            <i class="fa-solid fa-magnifying-glass"></i><span>Consultar Peça</span>
        </button>
    </header>

    <!-- MAIN CONTAINER -->
    <main class="flex-1 max-w-5xl mx-auto w-full p-6 md:p-10 flex items-center justify-center">
        <div class="bg-[#1C2541] border border-slate-800 rounded-3xl shadow-2xl p-8 w-full">
            <form id="pecaForm" novalidate onsubmit="salvarPeca(event)" class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <input type="hidden" id="pecaId">
                
                <div>
                    <label class="block text-sm font-medium text-slate-300 mb-1.5">Código Interno *</label>
                    <input type="text" id="codigoInterno" required class="w-full bg-[#0B132B] border border-slate-700/80 rounded-xl p-3 text-slate-100 focus:outline-none focus:border-[#E06666] focus:ring-1 focus:ring-[#E06666] transition">
                </div>

                <div>
                    <label class="block text-sm font-medium text-slate-300 mb-1.5">Código Original</label>
                    <input type="text" id="codigoOriginal" class="w-full bg-[#0B132B] border border-slate-700/80 rounded-xl p-3 text-slate-100 focus:outline-none focus:border-[#E06666] focus:ring-1 focus:ring-[#E06666] transition">
                </div>

                <div>
                    <label class="block text-sm font-medium text-slate-300 mb-1.5">Marca *</label>
                    <input type="text" id="marca" required class="w-full bg-[#0B132B] border border-slate-700/80 rounded-xl p-3 text-slate-100 focus:outline-none focus:border-[#E06666] focus:ring-1 focus:ring-[#E06666] transition">
                </div>

                <div>
                    <label class="block text-sm font-medium text-slate-300 mb-1.5">Fornecedor</label>
                    <input type="text" id="fornecedor" class="w-full bg-[#0B132B] border border-slate-700/80 rounded-xl p-3 text-slate-100 focus:outline-none focus:border-[#E06666] focus:ring-1 focus:ring-[#E06666] transition">
                </div>

                <div>
                    <label class="block text-sm font-medium text-slate-300 mb-1.5">Descrição do Item *</label>
                    <input type="text" id="descricao" required class="w-full bg-[#0B132B] border border-slate-700/80 rounded-xl p-3 text-slate-100 focus:outline-none focus:border-[#E06666] focus:ring-1 focus:ring-[#E06666] transition">
                </div>

                <div>
                    <label class="block text-sm font-medium text-slate-300 mb-1.5">Aplicação</label>
                    <input type="text" id="aplicacao" class="w-full bg-[#0B132B] border border-slate-700/80 rounded-xl p-3 text-slate-100 focus:outline-none focus:border-[#E06666] focus:ring-1 focus:ring-[#E06666] transition">
                </div>

                <div>
                    <label class="block text-sm font-medium text-slate-300 mb-1.5">Unidade de medida *</label>
                    <select id="unidadeMedida" required class="w-full bg-[#0B132B] border border-slate-700/80 rounded-xl p-3 text-slate-100 focus:outline-none focus:border-[#E06666] focus:ring-1 focus:ring-[#E06666] transition">
                        <option value="" class="bg-[#0B132B] text-slate-400">Selecione...</option>
                        <option value="UN">UN (Unidade)</option>
                        <option value="KG">KG (Quilograma)</option>
                        <option value="L">L (Litro)</option>
                        <option value="PAR">Par</option>
                        <option value="JOGO">Jogo</option>
                    </select>
                </div>

                <div>
                    <label class="block text-sm font-medium text-slate-300 mb-1.5">Localização *</label>
                    <input type="text" id="localizacao" required placeholder="Ex: Prateleira A-12" class="w-full bg-[#0B132B] border border-slate-700/80 rounded-xl p-3 text-slate-100 placeholder-slate-500 focus:outline-none focus:border-[#E06666] focus:ring-1 focus:ring-[#E06666] transition">
                </div>

                <div>
                    <label class="block text-sm font-medium text-slate-300 mb-1.5">Quantidade em estoque *</label>
                    <input type="number" id="quantidade" min="0" step="1" required placeholder="0" class="w-full bg-[#0B132B] border border-slate-700/80 rounded-xl p-3 text-slate-100 placeholder-slate-500 focus:outline-none focus:border-[#E06666] focus:ring-1 focus:ring-[#E06666] transition">
                </div>

                <div>
                    <label class="block text-sm font-medium text-slate-300 mb-1.5">Preço de venda (R$)</label>
                    <input type="number" id="precoVenda" min="0" step="0.01" placeholder="0,00" class="w-full bg-[#0B132B] border border-slate-700/80 rounded-xl p-3 text-slate-100 placeholder-slate-500 focus:outline-none focus:border-[#E06666] focus:ring-1 focus:ring-[#E06666] transition">
                </div>

                <div class="md:col-span-2 flex justify-end space-x-4 mt-4">
                    <button type="reset" onclick="resetForm()" class="bg-slate-800/80 hover:bg-slate-800 text-slate-300 border border-slate-700/60 px-6 py-3 rounded-xl font-medium transition">Limpar</button>
                    <button type="submit" class="bg-[#E06666] hover:bg-[#c95252] text-white px-8 py-3 rounded-xl font-semibold transition shadow-lg shadow-[#E06666]/20">Salvar Peça</button>
                </div>
            </form>
        </div>
    </main>

    <!-- MODAL DE CONSULTA -->
    <div id="consultaModal" class="hidden fixed inset-0 bg-black/80 backdrop-blur-md flex items-center justify-center p-4 z-50">
        <div class="bg-[#1C2541] border border-slate-800 rounded-3xl max-w-4xl w-full max-h-[85vh] flex flex-col shadow-2xl overflow-hidden">
            <div class="p-6 border-b border-slate-800 flex justify-between items-center">
                <h3 class="text-lg font-bold text-slate-100">Consulta de Peças</h3>
                <button onclick="closeModal()" class="text-slate-400 hover:text-white transition"><i class="fa-solid fa-xmark text-xl"></i></button>
            </div>
            <div class="p-6 border-b border-slate-800/60 bg-[#0B132B]/50">
                <input type="text" id="searchPeca" onkeyup="filtrarPecas()" placeholder="Pesquisar por código, descrição ou marca..." class="w-full bg-[#0B132B] border border-slate-700 rounded-xl p-3 text-slate-100 placeholder-slate-500 focus:outline-none focus:border-[#E06666]">
            </div>
            <div class="flex-1 overflow-y-auto p-6">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="border-b border-slate-800 text-slate-400 text-sm">
                            <th class="pb-3">Cód. Interno</th>
                            <th class="pb-3">Descrição</th>
                            <th class="pb-3">Marca</th>
                            <th class="pb-3">Localização</th>
                            <th class="pb-3 text-right">Ações</th>
                        </tr>
                    </thead>
                    <tbody id="tabelaPecas" class="divide-y divide-slate-800/60 text-sm text-slate-200"></tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- TOAST NOTIFICATION -->
    <div id="toast" class="hidden fixed bottom-6 right-6 bg-emerald-600 text-white px-6 py-3.5 rounded-xl shadow-2xl transition-all duration-300 z-50 font-medium"></div>

    <script src="../../Validacoes/validacoesCu.js"></script>
    <script src="../../FrontApi/Api.js"></script>
    <script src="cdPeca.js"></script>
</body>
</html>
