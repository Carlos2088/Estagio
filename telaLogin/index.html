<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MOTORPOINT - Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col justify-between bg-grid-pattern relative overflow-x-hidden">

    <header class="w-full bg-slate-900/80 backdrop-blur-md border-b border-slate-800/80 px-6 py-4 flex items-center justify-between sticky top-0 z-40 shadow-lg">
        <div class="max-w-7xl mx-auto w-full flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="bg-gradient-to-br from-[#e06666] to-[#b34747] text-white p-2.5 rounded-xl shadow-md flex items-center justify-center font-bold tracking-wider text-lg">
                    <i class="fa-solid fa-motorcycle text-xl text-black"></i>
                    <span class="ml-2 font-extrabold text-xs tracking-widest uppercase">LOGO</span>
                </div>
                <div class="h-6 w-px bg-slate-700/60 hidden sm:block"></div>
                <h1 class="text-2xl font-black tracking-wider text-slate-100 uppercase italic">MOTOR<span class="text-[#e06666]">POINT</span></h1>
            </div>
            <span class="inline-flex items-center px-3 py-1 rounded-full text-xs font-medium bg-emerald-500/10 text-emerald-400 border border-emerald-500/20">
                <span class="w-2 h-2 mr-1.5 bg-emerald-500 rounded-full animate-pulse"></span>Sistema Online
            </span>
        </div>
    </header>

    <main class="flex-1 flex items-center justify-center p-4 my-8 relative">
        <div class="absolute -top-10 left-1/2 -translate-x-1/2 w-96 h-96 bg-[#e06666]/10 rounded-full blur-3xl pointer-events-none"></div>

        <div class="w-full max-w-md bg-slate-900/90 border border-slate-800 rounded-2xl shadow-2xl p-8 backdrop-blur-xl relative z-10 glow-red">
            <div class="text-center mb-8">
                <div class="inline-flex p-3 rounded-full bg-slate-800/80 border border-slate-700 text-[#e06666] mb-3 shadow-inner">
                    <i class="fa-solid fa-lock text-2xl"></i>
                </div>
                <h2 class="text-2xl font-bold text-white tracking-tight">Acesso ao Sistema</h2>
                <p class="text-sm text-slate-400 mt-1">Informe suas credenciais para continuar</p>
            </div>

            <div id="loginError" class="hidden mb-6 p-4 rounded-xl bg-red-500/10 border border-red-500/30 text-red-400 text-sm flex items-center space-x-3">
                <i class="fa-solid fa-circle-exclamation text-lg flex-shrink-0"></i>
                <span id="errorMessage">Usuário ou senha incorretos!</span>
            </div>

            <form id="loginForm" class="space-y-6">
                <div>
                    <label for="usuario" class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-2">Usuário / Email / CPF</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-slate-400"><i class="fa-solid fa-user"></i></div>
                        <input type="text" id="usuario" required placeholder="Digite seu usuário ou email" class="w-full pl-11 pr-4 py-3.5 bg-slate-950/80 border border-slate-700/80 rounded-full text-slate-100 placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-[#e06666] focus:border-transparent transition-all shadow-inner text-sm">
                    </div>
                </div>

                <div>
                    <div class="flex items-center justify-between mb-2">
                        <label for="senha" class="block text-xs font-semibold text-slate-300 uppercase tracking-wider">Senha</label>
                        <a href="#" id="linkEsqueceu" class="text-xs text-[#e06666] hover:underline font-medium">Esqueceu a senha?</a>
                    </div>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-slate-400"><i class="fa-solid fa-key"></i></div>
                        <input type="password" id="senha" required placeholder="••••••••" class="w-full pl-11 pr-11 py-3.5 bg-slate-950/80 border border-slate-700/80 rounded-full text-slate-100 placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-[#e06666] focus:border-transparent transition-all shadow-inner text-sm">
                        <button type="button" id="btnOlho" class="absolute inset-y-0 right-0 pr-4 flex items-center text-slate-400 hover:text-slate-200 transition" title="Mostrar/ocultar senha" aria-label="Mostrar/ocultar senha">
                            <i id="eyeIcon" class="fa-solid fa-eye"></i>
                        </button>
                    </div>
                </div>

                <label class="flex items-center cursor-pointer space-x-2 text-sm text-slate-400 hover:text-slate-200 transition">
                    <input type="checkbox" id="lembrar" class="w-4 h-4 rounded bg-slate-950 border-slate-700 text-[#e06666] focus:ring-[#e06666]">
                    <span>Lembrar de mim</span>
                </label>

                <button type="submit" id="btnSubmit" class="w-full py-3.5 px-6 rounded-full bg-gradient-to-r from-[#e06666] to-[#b34747] text-white font-bold text-sm tracking-wide shadow-lg hover:scale-[1.01] active:scale-[0.99] transition-all flex items-center justify-center space-x-2">
                    <span>Entrar no Sistema</span><i class="fa-solid fa-arrow-right"></i>
                </button>
            </form>

            <div class="mt-6 pt-6 border-t border-slate-800 text-center">
                <p class="text-xs text-slate-500">Acesso demonstrativo: <span class="text-slate-300 font-mono bg-slate-800 px-2 py-0.5 rounded">admin</span> / <span class="text-slate-300 font-mono bg-slate-800 px-2 py-0.5 rounded">123456</span></p>
            </div>
        </div>
    </main>

    <footer class="w-full bg-slate-900/90 border-t border-slate-800 py-4 px-6 text-slate-400 text-xs">
        <div class="max-w-7xl mx-auto flex flex-col md:flex-row items-center justify-between gap-4">
            <div class="flex items-center space-x-4 text-base">
                <a href="#" class="hover:text-[#e06666] transition" aria-label="Instagram"><i class="fa-brands fa-instagram"></i></a>
                <a href="#" class="hover:text-[#e06666] transition" aria-label="Facebook"><i class="fa-brands fa-facebook"></i></a>
                <a href="#" class="hover:text-[#e06666] transition" aria-label="WhatsApp"><i class="fa-brands fa-whatsapp"></i></a>
            </div>
            <p>&copy; 2026 MOTORPOINT. Todos os direitos reservados.</p>
        </div>
    </footer>

    <script>
    const MENU_URL = '../menuPrincipal/index.html';
    const SESSAO_KEY = 'motorpoint_user_session';

    function lerLS(chave, padrao) {
        try { return JSON.parse(localStorage.getItem(chave)) || padrao; } catch (e) { return padrao; }
    }

    function toggleSenhaVisibility() {
        const input = document.getElementById('senha');
        const icon = document.getElementById('eyeIcon');
        const mostrar = input.type === 'password';
        input.type = mostrar ? 'text' : 'password';
        icon.className = mostrar ? 'fa-solid fa-eye-slash' : 'fa-solid fa-eye';
    }

    function realizarLogin(e) {
        e.preventDefault();
        const usuario = document.getElementById('usuario').value.trim();
        const senha = document.getElementById('senha').value;
        const lembrar = document.getElementById('lembrar').checked;
        const erro = document.getElementById('loginError');
        const btn = document.getElementById('btnSubmit');

        erro.classList.add('hidden');
        btn.disabled = true;
        btn.innerHTML = '<i class="fa-solid fa-spinner animate-spin"></i> <span>Autenticando...</span>';

        setTimeout(() => {
            const entrada = usuario.toLowerCase();
            const cadastrados = lerLS('oficina_usuarios', []);
            const valido = (usuario === 'admin' && senha === '123456') ||
                cadastrados.some(u =>
                    [u.email, u.nome, u.documento].some(c => c && String(c).toLowerCase() === entrada) &&
                    u.senha === senha
                );

            if (valido) {
                if (lembrar) localStorage.setItem('motorpoint_remembered_user', usuario);
                else localStorage.removeItem('motorpoint_remembered_user');
                localStorage.setItem(SESSAO_KEY, JSON.stringify({ usuario, loginTime: new Date().toISOString() }));
                window.location.href = MENU_URL;
            } else {
                document.getElementById('errorMessage').innerText = 'Usuário ou senha incorretos. Tente admin / 123456';
                erro.classList.remove('hidden');
                btn.disabled = false;
                btn.innerHTML = '<span>Entrar no Sistema</span> <i class="fa-solid fa-arrow-right"></i>';
            }
        }, 800);
    }

    document.addEventListener('DOMContentLoaded', () => {
        document.getElementById('loginForm').addEventListener('submit', realizarLogin);
        document.getElementById('btnOlho').addEventListener('click', toggleSenhaVisibility);
        document.getElementById('linkEsqueceu').addEventListener('click', (e) => {
            e.preventDefault();
            alert('Para redefinir sua senha, entre em contato com o suporte ou administrador do sistema MOTORPOINT.');
        });

        const salvo = localStorage.getItem('motorpoint_remembered_user');
        if (salvo) {
            document.getElementById('usuario').value = salvo;
            document.getElementById('lembrar').checked = true;
        }
    });
    </script>
</body>
</html>
