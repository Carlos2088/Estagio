<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro Moto - Oficina</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-[#e06666] min-h-screen flex flex-col font-sans text-slate-900">

    <!-- HEADER -->
    <header class="bg-[#b34747] text-white px-8 py-4 flex items-center justify-between shadow-md">
        <div class="flex items-center space-x-3">
            <a href="../menuPrincipal/index.html" class="hover:opacity-80 transition"><i class="fa-solid fa-arrow-left text-xl"></i></a>
            <h1 class="text-xl font-bold tracking-wide">Cadastro Moto</h1>
        </div>
        <button onclick="openModal()" class="bg-white text-[#b34747] px-4 py-2 rounded-lg font-semibold shadow hover:bg-slate-100 transition flex items-center space-x-2">
            <i class="fa-solid fa-search"></i><span>Consultar Moto</span>
        </button>
    </header>

    <!-- FORMULÁRIO -->
    <main class="flex-1 max-w-5xl mx-auto w-full p-8 flex items-center justify-center">
        <div class="bg-white/95 backdrop-blur-md rounded-2xl shadow-2xl p-8 w-full border border-white/20">
            <form id="motoForm" onsubmit="salvarMoto(event)" class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <input type="hidden" id="motoId">
                
                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-1">Dono / Cliente *</label>
                    <input type="text" id="dono" required placeholder="Nome do proprietário" class="w-full bg-slate-100 border border-slate-300 rounded-lg p-3 text-slate-800 focus:outline-none focus:ring-2 focus:ring-[#e06666]">
                </div>

                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-1">Marca *</label>
                    <input type="text" id="marcaMoto" required placeholder="Ex: Honda, Yamaha" class="w-full bg-slate-100 border border-slate-300 rounded-lg p-3 text-slate-800 focus:outline-none focus:ring-2 focus:ring-[#e06666]">
                </div>

                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-1">Placa *</label>
                    <input type="text" id="placa" required placeholder="ABC1D23 ou ABC-1234" oninput="this.value = this.value.toUpperCase()" class="w-full bg-slate-100 border border-slate-300 rounded-lg p-3 text-slate-800 focus:outline-none focus:ring-2 focus:ring-[#e06666]">
                </div>

                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-1">Cor *</label>
                    <input type="text" id="cor" required placeholder="Ex: Vermelho, Preto Fosco" class="w-full bg-slate-100 border border-slate-300 rounded-lg p-3 text-slate-800 focus:outline-none focus:ring-2 focus:ring-[#e06666]">
                </div>

                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-1">Chassi * (17 caracteres)</label>
                    <input type="text" id="chassi" required maxlength="17" placeholder="9BWZZZ..." oninput="this.value = this.value.toUpperCase()" class="w-full bg-slate-100 border border-slate-300 rounded-lg p-3 text-slate-800 focus:outline-none focus:ring-2 focus:ring-[#e06666]">
                </div>

                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-1">Ano de Fabricação *</label>
                    <input type="number" id="ano" required min="1950" max="2027" placeholder="2024" class="w-full bg-slate-100 border border-slate-300 rounded-lg p-3 text-slate-800 focus:outline-none focus:ring-2 focus:ring-[#e06666]">
                </div>

                <div class="md:col-span-2">
                    <label class="block text-sm font-semibold text-slate-700 mb-1">Modelo *</label>
                    <input type="text" id="modelo" required placeholder="Ex: CB 500X, Fazer 250" class="w-full bg-slate-100 border border-slate-300 rounded-lg p-3 text-slate-800 focus:outline-none focus:ring-2 focus:ring-[#e06666]">
                </div>

                <div class="md:col-span-2 flex justify-end space-x-4 mt-4">
                    <button type="reset" onclick="resetForm()" class="bg-slate-200 text-slate-700 px-6 py-3 rounded-lg font-semibold hover:bg-slate-300 transition">Limpar</button>
                    <button type="submit" class="bg-[#e06666] text-white px-8 py-3 rounded-lg font-semibold hover:bg-[#b34747] transition shadow-lg">Salvar Moto</button>
                </div>
            </form>
        </div>
    </main>

    <!-- MODAL DE CONSULTA -->
    <div id="consultaModal" class="hidden fixed inset-0 bg-slate-950/70 backdrop-blur-sm flex items-center justify-center p-4 z-50">
        <div class="bg-white rounded-2xl max-w-4xl w-full max-h-[85vh] flex flex-col shadow-2xl overflow-hidden">
            <div class="p-6 bg-[#b34747] text-white flex justify-between items-center">
                <h3 class="text-lg font-bold">Consulta de Motos</h3>
                <button onclick="closeModal()" class="text-white hover:opacity-80"><i class="fa-solid fa-xmark text-xl"></i></button>
            </div>
            <div class="p-6 border-b border-slate-200">
                <input type="text" id="searchMoto" onkeyup="filtrarMotos()" placeholder="Pesquisar por placa, dono ou modelo..." class="w-full bg-slate-100 border border-slate-300 rounded-lg p-3 text-slate-800 focus:outline-none focus:ring-2 focus:ring-[#e06666]">
            </div>
            <div class="flex-1 overflow-y-auto p-6">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="border-b border-slate-200 text-slate-600 text-sm">
                            <th class="pb-3">Placa</th>
                            <th class="pb-3">Modelo</th>
                            <th class="pb-3">Dono</th>
                            <th class="pb-3">Ano</th>
                            <th class="pb-3 text-right">Ações</th>
                        </tr>
                    </thead>
                    <tbody id="tabelaMotos" class="divide-y divide-slate-100 text-sm"></tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- TOAST NOTIFICATION -->
    <div id="toast" class="hidden fixed bottom-5 right-5 bg-emerald-600 text-white px-6 py-3 rounded-xl shadow-2xl transition-all duration-300 z-50 font-medium"></div>

    <script>
        function showToast(msg) {
            const t = document.getElementById('toast');
            t.innerText = msg;
            t.classList.remove('hidden');
            setTimeout(() => t.classList.add('hidden'), 3000);
        }

        function getMotos() { return JSON.parse(localStorage.getItem('oficina_motos') || '[]'); }
        function saveMotos(motos) { localStorage.setItem('oficina_motos', JSON.stringify(motos)); }

        function salvarMoto(e) {
            e.preventDefault();
            const id = document.getElementById('motoId').value;
            const chassi = document.getElementById('chassi').value;

            if (chassi.length !== 17) {
                alert('O chassi precisa ter exatamente 17 caracteres.');
                return;
            }

            const nova = {
                id: id ? id : Date.now().toString(),
                dono: document.getElementById('dono').value,
                marca: document.getElementById('marcaMoto').value,
                placa: document.getElementById('placa').value,
                cor: document.getElementById('cor').value,
                chassi: chassi,
                ano: document.getElementById('ano').value,
                modelo: document.getElementById('modelo').value
            };

            let motos = getMotos();
            if (id) {
                motos = motos.map(m => m.id === id ? nova : m);
                showToast('Moto atualizada com sucesso!');
            } else {
                if (motos.some(m => m.placa === nova.placa)) {
                    alert('Já existe uma moto cadastrada com esta placa!');
                    return;
                }
                motos.push(nova);
                showToast('Moto cadastrada com sucesso!');
            }
            saveMotos(motos);
            resetForm();
        }

        function resetForm() {
            document.getElementById('motoForm').reset();
            document.getElementById('motoId').value = '';
        }

        function openModal() {
            document.getElementById('consultaModal').classList.remove('hidden');
            renderTabela(getMotos());
        }

        function closeModal() { document.getElementById('consultaModal').classList.add('hidden'); }

        function renderTabela(dados) {
            const tbody = document.getElementById('tabelaMotos');
            tbody.innerHTML = dados.length === 0 ? '<tr><td colspan="5" class="py-4 text-center text-slate-400">Nenhuma moto cadastrada.</td></tr>' : '';
            dados.forEach(m => {
                tbody.innerHTML += `
                    <tr class="hover:bg-slate-50 transition">
                        <td class="py-3 font-semibold text-slate-700">${m.placa}</td>
                        <td class="py-3 text-slate-600">${m.modelo}</td>
                        <td class="py-3 text-slate-600">${m.dono}</td>
                        <td class="py-3"><span class="bg-slate-100 text-slate-700 px-2.5 py-1 rounded-md text-xs font-semibold">${m.ano}</span></td>
                        <td class="py-3 text-right space-x-2">
                            <button onclick="editarMoto('${m.id}')" class="text-blue-600 hover:text-blue-800"><i class="fa-solid fa-pen"></i></button>
                            <button onclick="excluirMoto('${m.id}')" class="text-red-600 hover:text-red-800"><i class="fa-solid fa-trash"></i></button>
                        </td>
                    </tr>`;
            });
        }

        function filtrarMotos() {
            const termo = document.getElementById('searchMoto').value.toLowerCase();
            const motos = getMotos();
            const filtradas = motos.filter(m => m.placa.toLowerCase().includes(termo) || m.dono.toLowerCase().includes(termo) || m.modelo.toLowerCase().includes(termo));
            renderTabela(filtradas);
        }

        function editarMoto(id) {
            const m = getMotos().find(item => item.id === id);
            if (!m) return;
            document.getElementById('motoId').value = m.id;
            document.getElementById('dono').value = m.dono;
            document.getElementById('marcaMoto').value = m.marca;
            document.getElementById('placa').value = m.placa;
            document.getElementById('cor').value = m.cor;
            document.getElementById('chassi').value = m.chassi;
            document.getElementById('ano').value = m.ano;
            document.getElementById('modelo').value = m.modelo;
            closeModal();
            showToast('Moto carregada para edição.');
        }

        function excluirMoto(id) {
            if (confirm('Deseja realmente excluir esta moto?')) {
                let motos = getMotos().filter(m => m.id !== id);
                saveMotos(motos);
                renderTabela(motos);
                showToast('Moto excluída com sucesso!');
            }
        }
    </script>
</body>
</html>
