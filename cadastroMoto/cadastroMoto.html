<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro Moto - MOTORPOINT</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #0B132B; }
    </style>
</head>
<body class="text-slate-100 min-h-screen flex flex-col font-sans">

    <!-- HEADER -->
    <header class="bg-[#1C2541] border-b border-slate-800/80 px-8 py-4 flex items-center justify-between shadow-lg">
        <div class="flex items-center space-x-4">
            <a href="../menuPrincipal/index.html" class="text-slate-300 hover:text-white transition flex items-center space-x-2">
                <i class="fa-solid fa-arrow-left text-lg"></i>
            </a>
            <h1 class="text-xl font-bold tracking-wide text-slate-100">Cadastro Moto</h1>
        </div>
        <button onclick="openModal()" class="bg-[#E06666] hover:bg-[#c95252] text-white px-5 py-2.5 rounded-xl font-semibold shadow-md transition flex items-center space-x-2">
            <i class="fa-solid fa-magnifying-glass"></i><span>Consultar Moto</span>
        </button>
    </header>

    <!-- MAIN CONTAINER -->
    <main class="flex-1 max-w-5xl mx-auto w-full p-6 md:p-10 flex items-center justify-center">
        <div class="bg-[#1C2541] border border-slate-800 rounded-3xl shadow-2xl p-8 w-full">
            <form id="motoForm" onsubmit="salvarMoto(event)" class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <input type="hidden" id="motoId">
                
                <div>
                    <label class="block text-sm font-medium text-slate-300 mb-1.5">Dono / Cliente *</label>
                    <input type="text" id="dono" required placeholder="Nome do proprietário" class="w-full bg-[#0B132B] border border-slate-700/80 rounded-xl p-3 text-slate-100 placeholder-slate-500 focus:outline-none focus:border-[#E06666] focus:ring-1 focus:ring-[#E06666] transition">
                </div>

                <div>
                    <label class="block text-sm font-medium text-slate-300 mb-1.5">Marca *</label>
                    <input type="text" id="marcaMoto" required placeholder="Ex: Honda, Yamaha" class="w-full bg-[#0B132B] border border-slate-700/80 rounded-xl p-3 text-slate-100 placeholder-slate-500 focus:outline-none focus:border-[#E06666] focus:ring-1 focus:ring-[#E06666] transition">
                </div>

                <div>
                    <label class="block text-sm font-medium text-slate-300 mb-1.5">Placa *</label>
                    <input type="text" id="placa" required placeholder="ABC1D23 ou ABC-1234" oninput="this.value = this.value.toUpperCase()" class="w-full bg-[#0B132B] border border-slate-700/80 rounded-xl p-3 text-slate-100 placeholder-slate-500 focus:outline-none focus:border-[#E06666] focus:ring-1 focus:ring-[#E06666] transition">
                </div>

                <div>
                    <label class="block text-sm font-medium text-slate-300 mb-1.5">Cor *</label>
                    <input type="text" id="cor" required placeholder="Ex: Vermelho, Preto Fosco" class="w-full bg-[#0B132B] border border-slate-700/80 rounded-xl p-3 text-slate-100 placeholder-slate-500 focus:outline-none focus:border-[#E06666] focus:ring-1 focus:ring-[#E06666] transition">
                </div>

                <div>
                    <label class="block text-sm font-medium text-slate-300 mb-1.5">Chassi * (17 caracteres)</label>
                    <input type="text" id="chassi" required maxlength="17" placeholder="9BWZZZ..." oninput="this.value = this.value.toUpperCase()" class="w-full bg-[#0B132B] border border-slate-700/80 rounded-xl p-3 text-slate-100 placeholder-slate-500 focus:outline-none focus:border-[#E06666] focus:ring-1 focus:ring-[#E06666] transition">
                </div>

                <div>
                    <label class="block text-sm font-medium text-slate-300 mb-1.5">Ano de Fabricação *</label>
                    <input type="number" id="ano" required min="1950" max="2027" placeholder="2024" class="w-full bg-[#0B132B] border border-slate-700/80 rounded-xl p-3 text-slate-100 placeholder-slate-500 focus:outline-none focus:border-[#E06666] focus:ring-1 focus:ring-[#E06666] transition">
                </div>

                <div class="md:col-span-2">
                    <label class="block text-sm font-medium text-slate-300 mb-1.5">Modelo *</label>
                    <input type="text" id="modelo" required placeholder="Ex: CB 500X, Fazer 250" class="w-full bg-[#0B132B] border border-slate-700/80 rounded-xl p-3 text-slate-100 placeholder-slate-500 focus:outline-none focus:border-[#E06666] focus:ring-1 focus:ring-[#E06666] transition">
                </div>

                <div class="md:col-span-2 flex justify-end space-x-4 mt-4">
                    <button type="reset" onclick="resetForm()" class="bg-slate-800/80 hover:bg-slate-800 text-slate-300 border border-slate-700/60 px-6 py-3 rounded-xl font-medium transition">Limpar</button>
                    <button type="submit" class="bg-[#E06666] hover:bg-[#c95252] text-white px-8 py-3 rounded-xl font-semibold transition shadow-lg shadow-[#E06666]/20">Salvar Moto</button>
                </div>
            </form>
        </div>
    </main>

    <!-- MODAL DE CONSULTA -->
    <div id="consultaModal" class="hidden fixed inset-0 bg-black/80 backdrop-blur-md flex items-center justify-center p-4 z-50">
        <div class="bg-[#1C2541] border border-slate-800 rounded-3xl max-w-4xl w-full max-h-[85vh] flex flex-col shadow-2xl overflow-hidden">
            <div class="p-6 border-b border-slate-800 flex justify-between items-center">
                <h3 class="text-lg font-bold text-slate-100">Consulta de Motos</h3>
                <button onclick="closeModal()" class="text-slate-400 hover:text-white transition"><i class="fa-solid fa-xmark text-xl"></i></button>
            </div>
            <div class="p-6 border-b border-slate-800/60 bg-[#0B132B]/50">
                <input type="text" id="searchMoto" onkeyup="filtrarMotos()" placeholder="Pesquisar por placa, dono ou modelo..." class="w-full bg-[#0B132B] border border-slate-700 rounded-xl p-3 text-slate-100 placeholder-slate-500 focus:outline-none focus:border-[#E06666]">
            </div>
            <div class="flex-1 overflow-y-auto p-6">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="border-b border-slate-800 text-slate-400 text-sm">
                            <th class="pb-3">Placa</th>
                            <th class="pb-3">Modelo</th>
                            <th class="pb-3">Dono</th>
                            <th class="pb-3">Ano</th>
                            <th class="pb-3 text-right">Ações</th>
                        </tr>
                    </thead>
                    <tbody id="tabelaMotos" class="divide-y divide-slate-800/60 text-sm text-slate-200"></tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- TOAST NOTIFICATION -->
    <div id="toast" class="hidden fixed bottom-6 right-6 bg-emerald-600 text-white px-6 py-3.5 rounded-xl shadow-2xl transition-all duration-300 z-50 font-medium"></div>

    <script>
        function showToast(msg) {
            const t = document.getElementById('toast');
            t.innerText = msg;
            t.classList.remove('hidden');
            setTimeout(() => t.classList.add('hidden'), 3000);
        }

        function getMotos() { return JSON.parse(localStorage.getItem('oficina_motos') || '[]'); }
        function saveMotos(motos) { localStorage.setItem('oficina_motos', JSON.stringify(motos)); }

        function salvarMoto(e) {
            e.preventDefault();
            const id = document.getElementById('motoId').value;
            const chassi = document.getElementById('chassi').value.trim();

            if (chassi.length !== 17) {
                alert('O chassi precisa ter exatamente 17 caracteres.');
                return;
            }

            const nova = {
                id: id ? id : Date.now().toString(),
                dono: document.getElementById('dono').value.trim(),
                marca: document.getElementById('marcaMoto').value.trim(),
                placa: document.getElementById('placa').value.trim(),
                cor: document.getElementById('cor').value.trim(),
                chassi: chassi,
                ano: document.getElementById('ano').value,
                modelo: document.getElementById('modelo').value.trim()
            };

            let motos = getMotos();
            if (id) {
                motos = motos.map(m => m.id === id ? nova : m);
                showToast('Moto atualizada com sucesso!');
            } else {
                if (motos.some(m => m.placa === nova.placa)) {
                    alert('Já existe uma moto cadastrada com esta placa!');
                    return;
                }
                motos.push(nova);
                showToast('Moto cadastrada com sucesso!');
            }
            saveMotos(motos);
            resetForm();
        }

        function resetForm() {
            document.getElementById('motoForm').reset();
            document.getElementById('motoId').value = '';
        }

        function openModal() {
            document.getElementById('consultaModal').classList.remove('hidden');
            renderTabela(getMotos());
        }

        function closeModal() { document.getElementById('consultaModal').classList.add('hidden'); }

        function renderTabela(dados) {
            const tbody = document.getElementById('tabelaMotos');
            tbody.innerHTML = dados.length === 0 ? '<tr><td colspan="5" class="py-6 text-center text-slate-500">Nenhuma moto cadastrada.</td></tr>' : '';
            dados.forEach(m => {
                tbody.innerHTML += `
                    <tr class="hover:bg-slate-800/40 transition">
                        <td class="py-3.5 font-medium text-slate-100">${m.placa}</td>
                        <td class="py-3.5 text-slate-400">${m.modelo}</td>
                        <td class="py-3.5 text-slate-400">${m.dono}</td>
                        <td class="py-3.5"><span class="bg-[#E06666]/10 text-[#E06666] px-2.5 py-1 rounded-md text-xs font-medium">${m.ano}</span></td>
                        <td class="py-3.5 text-right space-x-3">
                            <button onclick="editarMoto('${m.id}')" class="text-blue-400 hover:text-blue-300 transition"><i class="fa-solid fa-pen"></i></button>
                            <button onclick="excluirMoto('${m.id}')" class="text-red-400 hover:text-red-300 transition"><i class="fa-solid fa-trash"></i></button>
                        </td>
                    </tr>`;
            });
        }

        function filtrarMotos() {
            const termo = document.getElementById('searchMoto').value.toLowerCase();
            const motos = getMotos();
            const filtradas = motos.filter(m => m.placa.toLowerCase().includes(termo) || m.dono.toLowerCase().includes(termo) || m.modelo.toLowerCase().includes(termo));
            renderTabela(filtradas);
        }

        function editarMoto(id) {
            const m = getMotos().find(item => item.id === id);
            if (!m) return;
            document.getElementById('motoId').value = m.id;
            document.getElementById('dono').value = m.dono;
            document.getElementById('marcaMoto').value = m.marca;
            document.getElementById('placa').value = m.placa;
            document.getElementById('cor').value = m.cor;
            document.getElementById('chassi').value = m.chassi;
            document.getElementById('ano').value = m.ano;
            document.getElementById('modelo').value = m.modelo;
            closeModal();
            showToast('Moto carregada para edição.');
        }

        function excluirMoto(id) {
            if (confirm('Deseja realmente excluir esta moto?')) {
                let motos = getMotos().filter(m => m.id !== id);
                saveMotos(motos);
                renderTabela(motos);
                showToast('Moto excluída com sucesso!');
            }
        }
    </script>
</body>
</html>
