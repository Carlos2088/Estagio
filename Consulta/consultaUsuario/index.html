<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consulta Clientes - MOTORPOINT</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style> body { background-color: #0B132B; } </style>
</head>
<body class="text-slate-100 min-h-screen flex flex-col font-sans">

    <!-- HEADER -->
    <header class="bg-[#1C2541] border-b border-slate-800/80 px-8 py-4 flex items-center justify-between shadow-lg">
        <div class="flex items-center space-x-4">
            <a href="../../menuPrincipal/index.html" class="text-slate-300 hover:text-white transition flex items-center space-x-2">
                <i class="fa-solid fa-arrow-left text-lg"></i>
            </a>
            <h1 class="text-xl font-bold tracking-wide text-slate-100">Consulta de Clientes</h1>
        </div>
        <a href="../../Cadastro/cadastroUsuario/cadastroUsuario.html" class="bg-[#E06666] hover:bg-[#c95252] text-white px-5 py-2.5 rounded-xl font-semibold shadow-md transition flex items-center space-x-2">
            <i class="fa-solid fa-user-plus"></i><span>Cadastrar Cliente</span>
        </a>
    </header>

    <!-- CONTAINER PRINCIPAL -->
    <main class="flex-1 max-w-7xl mx-auto w-full p-6 md:p-10 space-y-6">
        
        <!-- PAINEL DE FILTROS -->
        <div class="bg-[#1C2541] border border-slate-800 rounded-2xl p-6 shadow-xl">
            <div class="flex items-center justify-between mb-4">
                <h3 class="text-lg font-semibold text-slate-200 flex items-center space-x-2">
                    <i class="fa-solid fa-filter text-[#E06666]"></i><span>Filtros de Pesquisa</span>
                </h3>
                <button onclick="gerarRelatorio()" class="bg-emerald-600 hover:bg-emerald-500 text-white px-4 py-2 rounded-xl font-semibold text-sm transition flex items-center space-x-2 shadow-md">
                    <i class="fa-solid fa-file-pdf"></i><span>Gerar Relatório</span>
                </button>
            </div>
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                <div>
                    <label class="block text-xs font-medium text-slate-400 mb-1">Buscar por Nome / E-mail</label>
                    <input type="text" id="filtroTexto" onkeyup="aplicarFiltros()" placeholder="Digite para filtrar..." class="w-full bg-[#0B132B] border border-slate-700 rounded-xl p-2.5 text-sm text-slate-100 focus:outline-none focus:border-[#E06666]">
                </div>
                <div>
                    <label class="block text-xs font-medium text-slate-400 mb-1">Status</label>
                    <select id="filtroStatus" onchange="aplicarFiltros()" class="w-full bg-[#0B132B] border border-slate-700 rounded-xl p-2.5 text-sm text-slate-100 focus:outline-none focus:border-[#E06666]">
                        <option value="">Todos os status</option>
                        <option value="Ativo">Ativo</option>
                        <option value="Inativo">Inativo</option>
                    </select>
                </div>
                <div class="flex items-end">
                    <button onclick="limparFiltros()" class="w-full bg-slate-800 hover:bg-slate-700 text-slate-300 border border-slate-700 rounded-xl p-2.5 text-sm font-medium transition">Limpar Filtros</button>
                </div>
            </div>
        </div>

        <!-- TABELA -->
        <div class="bg-[#1C2541] border border-slate-800 rounded-2xl shadow-xl overflow-hidden">
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-[#0B132B]/80 border-b border-slate-800 text-slate-400 text-xs uppercase tracking-wider">
                            <th class="p-4">NOME</th>
                            <th class="p-4">NÚMERO</th>
                            <th class="p-4">E-MAIL</th>
                            <th class="p-4">PLACA</th>
                            <th class="p-4 text-center">STATUS</th>
                        </tr>
                    </thead>
                    <tbody id="tabelaClientes" class="divide-y divide-slate-800/60 text-sm text-slate-200">
                        <!-- Preenchido via JavaScript -->
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <script>
        function getDados() {
            const usuarios = JSON.parse(localStorage.getItem('oficina_usuarios') || '[]');
            const motos = JSON.parse(localStorage.getItem('oficina_motos') || '[]');
            
            return usuarios.map(u => {
                const motoDoCliente = motos.find(m => m.dono.toLowerCase() === u.nome.toLowerCase());
                return {
                    nome: u.nome,
                    numero: u.telefone || '(44) 99999-9999',
                    email: u.email,
                    placa: motoDoCliente ? motoDoCliente.placa : 'N/A',
                    status: 'Ativo'
                };
            });
        }

        let dadosAtuais = getDados();

        function renderTabela(lista) {
            const tbody = document.getElementById('tabelaClientes');
            tbody.innerHTML = lista.length === 0 ? '<tr><td colspan="5" class="p-6 text-center text-slate-500">Nenhum registo encontrado.</td></tr>' : '';
            
            lista.forEach(item => {
                tbody.innerHTML += `
                    <tr class="hover:bg-slate-800/40 transition">
                        <td class="p-4 font-medium text-slate-100">${item.nome}</td>
                        <td class="p-4 text-slate-400">${item.numero}</td>
                        <td class="p-4 text-slate-400">${item.email}</td>
                        <td class="p-4 font-mono text-xs text-[#E06666] font-semibold">${item.placa}</td>
                        <td class="p-4 text-center"><span class="bg-emerald-500/10 text-emerald-400 px-3 py-1 rounded-full text-xs font-medium">${item.status}</span></td>
                    </tr>`;
            });
        }

        function aplicarFiltros() {
            const texto = document.getElementById('filtroTexto').value.toLowerCase();
            const status = document.getElementById('filtroStatus').value;
            
            const todos = getDados();
            dadosAtuais = todos.filter(item => {
                const matchTexto = item.nome.toLowerCase().includes(texto) || item.email.toLowerCase().includes(texto) || item.numero.includes(texto);
                const matchStatus = status === '' || item.status === status;
                return matchTexto && matchStatus;
            });
            renderTabela(dadosAtuais);
        }

        function limparFiltros() {
            document.getElementById('filtroTexto').value = '';
            document.getElementById('filtroStatus').value = '';
            dadosAtuais = getDados();
            renderTabela(dadosAtuais);
        }

        function gerarRelatorio() {
            const janela = window.open('', '_blank');
            janela.document.write(`
                <html><head><title>Relatório de Clientes</title>
                <style>body{font-family:sans-serif;padding:20px;}table{width:100%;border-collapse:collapse;margin-top:20px;}th,td{border:1px solid #ddd;padding:10px;text-align:left;}th{background:#E06666;color:white;}</style>
                </head><body>
                <h2>Relatório de Clientes / Usuários - MOTORPOINT</h2>
                <p>Gerado em: ${new Date().toLocaleString('pt-BR')}</p>
                <table><thead><tr><th>NOME</th><th>NÚMERO</th><th>E-MAIL</th><th>PLACA</th><th>STATUS</th></tr></thead><tbody>
                ${dadosAtuais.map(i => `<tr><td>${i.nome}</td><td>${i.numero}</td><td>${i.email}</td><td>${i.placa}</td><td>${i.status}</td></tr>`).join('')}
                </tbody></table></body></html>
            `);
            janela.document.close();
            janela.print();
        }

        renderTabela(dadosAtuais);
    </script>
</body>
</html>
